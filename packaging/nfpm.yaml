# https://nfpm.goreleaser.com/configuration/
name: kairon
arch: amd64
platform: linux
version: ${VERSION}
section: utils
priority: optional
maintainer: Lusan Sapkota <sapkotalusan@gmail.com>
description: |-
  Local-first desktop planner for tasks, projects, calendar, and notes.
  Built with Wails (Go) + React. Data stays in local SQLite.
vendor: Lusan Sapkota
homepage: https://github.com/Lusan-sapkota/Kairon
license: MIT
depends:
  - libgtk-3-0
  - libwebkit2gtk-4.1-0
contents:
  - src: ./build/bin/kairon
    dst: /usr/bin/kairon
    file_info:
      mode: 0755
  - src: ./packaging/kairon.desktop
    dst: /usr/share/applications/kairon.desktop
  - src: ./frontend/src/assets/images/kairon.png
    dst: /usr/share/pixmaps/kairon.png
  - src: ./frontend/src/assets/images/kairon.png
    dst: /usr/share/icons/hicolor/256x256/apps/kairon.png
